<!doctype html>
<!-- Sempre em português, sem tradução automática. Com lang="en" o Chrome do
     Android "traduzia" a página de inglês para português e inventava
     palavras ("Grupo restrito" virou "Grupo lésbico"). translate="no" vale
     para Chrome, Edge e Safari; a classe notranslate e a meta "google"
     cobrem o Google Tradutor, inclusive quando a pessoa pede a tradução. -->
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Wyllian Nava</title>
    <meta
      name="description"
      content="Imersão em Incorporação Imobiliária com o Dr. Wyllian Nava, Oficial Substituto do 3º Registro de Imóveis de São Luís/MA."
    />
    <meta name="author" content="Dr. Wyllian Nava" />
    <!-- Cor da barra do navegador no celular: o creme do fundo do site -->
    <meta name="theme-color" content="#F2EAE3" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:title" content="Dr. Wyllian Nava" />
    <meta
      property="og:description"
      content="Imersão em Incorporação Imobiliária com o Dr. Wyllian Nava, Oficial Substituto do 3º Registro de Imóveis de São Luís/MA."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-imersao.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Device ID da Mercado Pago (window.MP_DEVICE_SESSION_ID): o checkout o
         repassa ao antifraude, ver api/checkout.ts. -->
    <script src="https://www.mercadopago.com/v2/security.js" view="checkout"></script>
  </body>
</html>
