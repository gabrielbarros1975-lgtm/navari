<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Wyllian Nava</title>
    <meta
      name="description"
      content="Imersão em Incorporação Imobiliária com o Dr. Wyllian Nava, Oficial Substituto do 3º Registro de Imóveis de São Luís/MA."
    />
    <meta name="author" content="Dr. Wyllian Nava" />
    <meta name="theme-color" content="#0D1620" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:title" content="Dr. Wyllian Nava" />
    <meta
      property="og:description"
      content="Imersão em Incorporação Imobiliária com o Dr. Wyllian Nava, Oficial Substituto do 3º Registro de Imóveis de São Luís/MA."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-imersao.jpg" />

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      A landing usa tema claro (o resto do site segue escuro). Se esperar o
      React montar para aplicar a classe, a primeira pintura sai no tema escuro
      e a página pisca de navy para creme. Aqui o tema entra antes de qualquer
      pintura; o React cuida da navegação interna e da limpeza ao sair.

      "/workshop" é um apelido do início, e "/v2" redireciona para ele — os três
      precisam estar aqui, senão o redirecionamento piscaria antes de acontecer.
    -->
    <script>
      var landing = ["", "/workshop", "/v2"];
      if (landing.indexOf(window.location.pathname.replace(/\/$/, "")) !== -1) {
        document.documentElement.classList.add("theme-paper");
      }
    </script>

    <!--
      Por padrão o navegador devolve a pessoa para onde ela estava ao recarregar.
      Numa landing isso atrapalha: a abertura do hero e o pergaminho lacrado do
      celular são justamente o começo da história, e quem recarregava caía no
      meio da página. Com "manual" a recarga sempre começa do topo.

      Links com âncora (#inscricao, #faq) continuam funcionando: quando há hash
      na URL, o próprio navegador rola até a seção depois de carregar.
    -->
    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
